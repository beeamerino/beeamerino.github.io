# Bilingual site. Spanish is the default profile (root), English lives in en/.
#   Spanish preview:  quarto preview
#   English preview:  quarto preview --profile en
#   Full build:       bash scripts/build_site.sh   (both languages into _site/)
project:
  type: website
  pre-render:
    - python3 scripts/build_publications.py
    - python3 scripts/build_gallery.py
  resources:
    - assets/img/
    - assets/cv/
    - assets/pdf/
    - assets/gallery/

profile:
  default: es

website:
  site-url: "https://beeamerino.github.io"
  favicon: assets/img/favicon.svg
  image: assets/img/social-card.png
  open-graph: true
  twitter-card: true
  page-navigation: false
  back-to-top-navigation: true

format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark: [darkly, assets/css/custom.scss, assets/css/dark.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    title-block-banner: false
    respect-user-color-scheme: true
    include-after-body: assets/js/lang-toggle.html
